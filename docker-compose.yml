      - REACT_APP_I18N_CONFIG_KEY=customI18nConfig
      - REACT_APP_BASE_LAYOUT_CONFIG_KEY=customLayoutConfig
      - REACT_APP_RECAPTCHA_SITE_KEY=6Lf2Ov8SAAAAAMm1SmzH1GfwyKNAdx0AqFFmGzGZ
