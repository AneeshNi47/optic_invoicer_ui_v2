version: '3.8'
services:
  react-app:
    build: .
    ports:
      - "80:80"
    container_name: react-app
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_BASE_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
